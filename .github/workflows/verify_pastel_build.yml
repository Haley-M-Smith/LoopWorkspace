name: Verify Loop simulator build

on:
  pull_request:
    branches: [next-dev-pink]

permissions:
  contents: read

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
      - name: Apply cosmetic patches
        run: bash Scripts/apply_pastel_patches.sh
      - name: Compile for iOS Simulator
        run: |
          xcodebuild -quiet build-for-testing \
            -workspace LoopWorkspace.xcworkspace \
            -scheme LoopWorkspace \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath build.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Run iOS Simulator tests
        run: |
          xcodebuild -quiet test-without-building \
            -workspace LoopWorkspace.xcworkspace \
            -scheme LoopWorkspace \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -collect-test-diagnostics never \
            -resultBundlePath tests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Summarize Xcode results
        if: always()
        run: |
          if [[ -d build.xcresult ]]; then
            xcrun xcresulttool get build-results --path build.xcresult || true
          fi
          if [[ -d tests.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path tests.xcresult || true
          fi
